# Jobs, one entry per company, newest first. To add a company: copy the whole top entry, paste it above, edit.
# Dates are YYYY-MM (e.g. 2025-09); an end date can also be "present".
- company: Kellton Tech Solutions
  # companyUrl: https://...   # optional: makes the company name a link
  location: "Delhi, India"
  summary: "Building GenAI and ML solutions for enterprise clients: LLM-assisted verification, RAG over logs, ML cost forecasting, and analytics APIs."
  # Newest role first. A promotion = add another role above this one.
  # The dates at the top right are worked out from these (earliest start – latest end).
  roles:
    - title: Software Engineer
      type: Full-time
      start: 2025-09
      end: present
  # Projects at this company, newest first. did = 2–4 bullets. impact and link are optional.
  projects:
    - name: AI-Assisted Loan Docket Verification Engine
      start: 2026-10
      end: 2026-11
      description: >
        Verify home-loan dockets against OCR data across 150+ checks and a
        47-item checklist, and produce FTR/FTNR decisions.
      did:
        - "FastAPI engine that verifies home-loan dockets against OCR data across 150+ checks and a 47-item checklist"
        - "Hybrid fuzzy + LLM matching: RapidFuzz handles clear cases, low-score pairs escalate to an LLM via a confidence threshold, reducing false failures"
        - "Integrated the client's Data Fetch API through a mapping layer; fixed a mapping bug that failed every salaried applicant and documented API data gaps"
        - "Maintained 700+ pytest tests and supported UAT by debugging Celery, MongoDB and API errors from logs"
      stack: [Python, FastAPI, RapidFuzz, Azure OpenAI, Celery, MongoDB, Pytest]

    - name: AI-Powered Observability Platform
      start: 2026-06
      end: 2026-08
      description: >
        Turn unstructured application logs into a RAG chatbot that finds
        the relevant logs and generates root causes.
      did:
        - "Preprocessing pipeline that standardizes unstructured application logs for analysis"
        - "Relevance-based log retrieval with Chroma embeddings and hybrid search (0.5 cosine similarity threshold)"
        - "Reranking with cross-encoder/ms-marco-MiniLM-L-6-v2 before root cause generation"
      impact: "RAG Triad evaluation: 92% context relevance, 95% groundedness, 92% answer relevance"
      stack: [Python, Chroma, LangChain, Hugging Face, Azure OpenAI]

    - name: ML-Based Utility Cost Estimation
      start: 2026-05
      end: 2026-06
      description: >
        Predict utility project costs, split into material, internal labor,
        external labor and other.
      did:
        - "Identified key cost drivers through EDA to align input features with the prediction goal"
        - "Feature engineering, categorical encoding and XGBoost tuning with Optuna"
        - "Multivariate XGBoost model predicting four cost components at once"
      impact: "R² 0.75 material, 0.77 internal labor, 0.78 external labor, 0.78 other"
      stack: [Python, XGBoost, Optuna, Scikit-learn, Pandas, NumPy]

    - name: Survey Intelligence Platform
      start: 2025-11
      end: 2026-03
      description: >
        Build analytics for survey responses: click heatmaps and video
        audience reactions, served over REST APIs.
      did:
        - "Integrated MongoDB with Beanie ODM for survey response retrieval and processing"
        - "OpenCV heatmap images of survey click intensity, stored in Azure Blob Storage"
        - "Video pulse: aggregated ratings at user reaction timestamps into line graphs"
        - "Exposed heatmap and video pulse analytics through FastAPI REST APIs"
      stack: [Python, FastAPI, MongoDB, Beanie, OpenCV, Azure Blob Storage]
