# Shapes the hero ASCII canvas cycles through, in this order. Draw with "#" (shape) and "." (background).
# Every row in one shape must be the same width. One "#" = one character on screen, and a character
# is about twice as tall as it is wide, so draw circles twice as wide as they are tall.
# Keep shapes within ~48 wide x 22 tall; the canvas grid grows to fit the biggest one.
# The FIRST shape is the one shown (static) when motion is paused.
